name: Build kernel research probes

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip -q android-ndk-r29-linux.zip -d $HOME
        echo "ANDROID_NDK_HOME=$HOME/android-ndk-r29" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r29" >> $GITHUB_ENV
        echo "NDK_ROOT=$HOME/android-ndk-r29" >> $GITHUB_ENV

    - name: Build preload.so (aarch64)
      working-directory: exploit
      run: |
        make preload PROJECT=PD2314-AP3A.240905.015.A2 API=35 -j$(nproc) 2>&1
        ls -la build/PD2314-AP3A.240905.015.A2/bin/preload.so
        file build/PD2314-AP3A.240905.015.A2/bin/preload.so

    - name: Build mcast_test (32-bit ARM)
      working-directory: exploit
      run: |
        make mcast-test PROJECT=PD2314-AP3A.240905.015.A2 API=35 2>&1
        ls -la build/PD2314-AP3A.240905.015.A2/bin/mcast_test
        file build/PD2314-AP3A.240905.015.A2/bin/mcast_test

    - name: Build sched_test (32-bit ARM)
      working-directory: exploit
      run: |
        make sched-test PROJECT=PD2314-AP3A.240905.015.A2 API=35 2>&1
        ls -la build/PD2314-AP3A.240905.015.A2/bin/sched_test
        file build/PD2314-AP3A.240905.015.A2/bin/sched_test

    - name: Upload preload.so
      uses: actions/upload-artifact@v4
      with:
        name: preload-so-z8
        path: exploit/build/PD2314-AP3A.240905.015.A2/bin/preload.so
        if-no-files-found: error

    - name: Upload mcast_test
      uses: actions/upload-artifact@v4
      with:
        name: mcast-test-z8
        path: exploit/build/PD2314-AP3A.240905.015.A2/bin/mcast_test
        if-no-files-found: error

    - name: Upload sched_test
      uses: actions/upload-artifact@v4
      with:
        name: sched-test-z8
        path: exploit/build/PD2314-AP3A.240905.015.A2/bin/sched_test
        if-no-files-found: error
