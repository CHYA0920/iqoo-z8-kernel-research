name: Build kernel research probes

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip -q android-ndk-r29-linux.zip -d $HOME
        echo "ANDROID_NDK_HOME=$HOME/android-ndk-r29" >> $GITHUB_ENV

    - name: Build probe.so (aarch64)
      working-directory: exploit
      run: |
        make probe PROJECT=PD2314-AP3A.240905.015.A2 API=35 -j$(nproc) 2>&1
        ls -la build/PD2314-AP3A.240905.015.A2/bin/probe.so
        file build/PD2314-AP3A.240905.015.A2/bin/probe.so

    - name: Upload probe.so
      uses: actions/upload-artifact@v4
      with:
        name: probe-so-z8
        path: exploit/build/PD2314-AP3A.240905.015.A2/bin/probe.so
        if-no-files-found: error
